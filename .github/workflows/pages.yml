name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site and smoke-test browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage the existing website
        run: |
          mkdir -p _site
          git archive HEAD index.html trip socal | tar -x -C _site
      - name: Validate HTML scripts, itinerary and links
        run: node scripts/validate-site.cjs _site
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test phone and desktop layouts
        run: node scripts/smoke-site.cjs _site
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload tested website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy only after tests pass
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check published pages and exact itinerary
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          test -n "$base"
          for attempt in $(seq 1 8); do
            if curl -fsSL --max-time 20 "$base/?v=$GITHUB_SHA" -o /tmp/home.html &&
               curl -fsSL --max-time 20 "$base/trip/?v=$GITHUB_SHA" -o /tmp/trip.html &&
               curl -fsSL --max-time 20 "$base/socal/?v=$GITHUB_SHA" -o /tmp/socal.html &&
               curl -fsSL --max-time 20 "$base/trip/itinerary.json?v=$GITHUB_SHA" -o /tmp/itinerary.json &&
               cmp -s trip/itinerary.json /tmp/itinerary.json &&
               cmp -s trip/index.html /tmp/trip.html &&
               cmp -s socal/index.html /tmp/socal.html &&
               cmp -s index.html /tmp/home.html; then
              echo "Verified published homepage, itinerary, alias, and data at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published files did not match this commit"
          exit 1
